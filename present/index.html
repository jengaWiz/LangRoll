<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Try LangRoll</title>
  <meta name="description" content="Scan the code to open the LangRoll prototype on your phone.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="present.css?v=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e8473b'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='white'/%3E%3C/svg%3E">
</head>
<body>
  <div class="aura" aria-hidden="true"><span class="blob a"></span><span class="blob b"></span><span class="blob c"></span></div>

  <main class="stage">
    <section class="copy">
      <p class="logo"><span class="logo-mark" aria-hidden="true"></span>LangRoll</p>
      <h1>Grab your phone.<br><span class="grad">Start scrolling.</span></h1>
      <ol class="steps">
        <li><b>1</b>Open your camera</li>
        <li><b>2</b>Point it at the code</li>
        <li><b>3</b>Tap the link and pick a language</li>
      </ol>
      <p class="url">or go to <b>jengawiz.github.io/LangRoll/app</b></p>
      <p class="fine">No download, no sign-up. Works on iPhone and Android.</p>
    </section>

    <figure class="qr">
      <img src="qr.svg" alt="QR code that opens the LangRoll app at jengawiz.github.io/LangRoll/app" width="480" height="480">
      <figcaption>Scan to try the prototype</figcaption>
    </figure>
  </main>

  <p class="hint" id="hint">Press <kbd>F</kbd> for full screen</p>

  <script src="present.js?v=1"></script>
</body>
</html>
