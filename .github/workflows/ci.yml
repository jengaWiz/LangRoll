name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (JS, CSS, HTML)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run lint:html
      - name: QR code matches the app URL
        run: npm run check:qr

  api:
    name: API (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17 # matches Supabase's current major version
        env:
          # Throwaway container that only exists for this job, so no password is needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:api
      - run: npm run test:integration -w @langroll/api
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - run: npm run build -w @langroll/api

  api-image:
    name: API container (build, migrate, start)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway container that only exists for this job, so no password is needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      # Never contacted: /health and /ready don't verify tokens.
      SUPABASE_URL: https://example.supabase.co
      CORS_ORIGINS: https://jengawiz.github.io
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t langroll-api .
      - name: Image ships the database CA at the path fly.toml uses
        run: |
          ca=$(grep -oP 'DATABASE_CA = "\K[^"]+' apps/api/fly.toml)
          docker run --rm langroll-api sh -c "head -1 $ca" | grep -q "BEGIN CERTIFICATE"
      - name: Migrations run from the image
        run: docker run --rm --network host -e DATABASE_URL langroll-api node dist/migrate-cli.js
      - name: Server starts and reports ready
        run: |
          docker run -d --name api --network host -e DATABASE_URL -e SUPABASE_URL -e CORS_ORIGINS -e APP_VERSION=${{ github.sha }} langroll-api
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/ready && break; sleep 1; done
          curl -fs http://127.0.0.1:8787/health | grep -q '"version":"${{ github.sha }}"'
          curl -fs http://127.0.0.1:8787/ready | grep -q '"status":"ready"'
          test "$(docker exec api id -u)" != "0" # not running as root
      - name: Server logs
        if: always()
        run: docker logs api || true

  assets:
    name: Asset links & cache versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs the base branch to compare ?v= versions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: node scripts/build-site.mjs dist
      - name: Check assets
        run: node scripts/check-assets.mjs
        env:
          # On PRs, compare against the target branch; on pushes to main, only check links.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

  smoke:
    name: Smoke tests (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:smoke
        env:
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
